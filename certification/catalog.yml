    semantic_definitions:
      - applications
      - admits
      - deposits
      - yield
    consumers:
      - Admissions funnel reporting
    approval:
      approver_role: Data Governance Lead
      decision: Approved for demonstration use
  census_enrollment:
    model: analytics.fact_census_enrollment
    version: 1.0.0
    status: Certified
    definition: One row per student-term census record.
    tests:
      - dbt build
      - tests/fact_census_enrollment_grain.sql
    lineage: docs/phase4/lineage.md
    semantic_definitions:
