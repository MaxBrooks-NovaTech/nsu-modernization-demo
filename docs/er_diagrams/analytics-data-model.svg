<text x="40" y="30" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#12203f">Analytics Data Model — certified marts (analytics schema)</text>
<text x="40" y="52" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#666">3 independently-materialized, denormalized fact tables from models/marts/*.sql — no FK constraints between them (dbt does not enforce cross-model FKs). Conformed by shared business keys, not database relationships.</text>
<text x="40" y="72" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#666">Purple = grain key. Orange KEY = shared conformed business key (student_id/term_id/school_id/program_id). Green = certified metrics from semantic/metric_definitions.yml.</text>
