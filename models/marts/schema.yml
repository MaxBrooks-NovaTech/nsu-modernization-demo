version: 2
models:
  - name: fact_enrollment
    description: "One row per student registration in one section for one academic term."
    columns:
      - name: registration_id
        tests: [not_null, unique]
      - name: student_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_students')
                field: student_id
      - name: section_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_course_sections')
                field: section_id
      - name: term_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_terms')
                field: term_id
      - name: credit_hours
        tests: [not_null]
      - name: registration_status
        tests:
          - accepted_values:
              arguments:
                values: ['Dropped', 'Registered', 'Withdrawn']
  - name: fact_recruitment_funnel
    description: "One row per application, with governed admission and deposit outcomes."
    columns:
      - name: application_id
        tests: [not_null, unique]
      - name: student_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_students')
                field: student_id
      - name: term_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_terms')
                field: term_id
      - name: application_status
        tests: [not_null]
  - name: fact_census_enrollment
    description: "One row per student and academic term with certified census and IPEDS flags."
    columns:
      - name: enrollment_id
        tests: [not_null, unique]
      - name: student_id
        tests: [not_null]
      - name: term_id
        tests: [not_null]
      - name: census_enrolled_flag
        tests: [not_null]
      - name: ipeds_enrolled_flag
        tests: [not_null]
