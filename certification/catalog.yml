owner: Institutional Research and Analytics
steward: Data Governance Lead
products:
  fact_enrollment:
    model: analytics.FactEnrollment
    contract: contracts/fact_enrollment.yml
    version: 1.0.0
    status: Certified
    definition: One row per student registration in one section for one academic term.
    tests:
      - dbt build
